name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
  release:
    types: [created, edited, prereleased, published, released]

env:
  SPECS_VERSION: ${{ github.event.release.tag_name }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: 
      image: ubuntu:20.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build tools
      run: |
        DEBIAN_FRONTEND=noninteractive apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y gcc g++ make python3 python3-dev rpm git libexpat1-dev zlib1g-dev dpkg-dev

    - name: Configure
      working-directory: specs/src
      run: python3 setup.py --python python3 --static

    - name: Build
      working-directory: specs/src
      run: make some

    - name: Verify binary
      run: specs/exe/specs "@version"

    - name: Verify no dynamic libpython dependency
      run: |
        if ldd specs/exe/specs | grep -q libpython; then
          echo "ERROR: specs still dynamically links libpython"
          ldd specs/exe/specs | grep libpython
          exit 1
        fi
        echo "OK: no dynamic libpython dependency"

    - name: Prepare manpage
      run: |
        cp manpage specs.1
        gzip specs.1

    - name: Strip version prefix
      id: version
      run: echo "ver=${SPECS_VERSION#v}" >> "$GITHUB_OUTPUT"

    - name: Create RPM build tree
      run: |
        mkdir -p rpmbuild/BUILD
        mkdir -p rpmbuild/RPMS
        mkdir -p rpmbuild/SOURCES
        mkdir -p rpmbuild/SPECS
        mkdir -p rpmbuild/SRPMS
        mkdir -p rpmbuild/SOURCES/specs-${{ steps.version.outputs.ver }}
        cp specs/exe/specs rpmbuild/SOURCES/specs-${{ steps.version.outputs.ver }}/
        cp specs/exe/specs-autocomplete rpmbuild/SOURCES/specs-${{ steps.version.outputs.ver }}/
        cp specs.1.gz rpmbuild/SOURCES/specs-${{ steps.version.outputs.ver }}/
        
    - name: Bundle Python stdlib for RPM
      run: |
        PYVER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
        SRCDIR=rpmbuild/SOURCES/specs-${{ steps.version.outputs.ver }}
        mkdir -p ${SRCDIR}/python/lib/python${PYVER}
        cp -r /usr/lib/python${PYVER}/* ${SRCDIR}/python/lib/python${PYVER}/
        # Remove unnecessary files to reduce package size
        find ${SRCDIR}/python/lib/python${PYVER} -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        find ${SRCDIR}/python/lib/python${PYVER} -type f -name "*.pyc" -delete
        find ${SRCDIR}/python/lib/python${PYVER} -type f -name "*.pyo" -delete
        rm -rf ${SRCDIR}/python/lib/python${PYVER}/site-packages
        rm -rf ${SRCDIR}/python/lib/python${PYVER}/dist-packages
        
    - name: Create RPM tarball
      run: |
        cd rpmbuild/SOURCES
        tar czf specs-${{ steps.version.outputs.ver }}.tar.gz specs-${{ steps.version.outputs.ver }}

    - name: Create RPM spec file
      run: sed 's/@VERSION@/${{ steps.version.outputs.ver }}/g' .github/packaging/specs.spec.in > rpmbuild/SPECS/specs.spec

    - name: Build RPM
      run: |
        rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/specs.spec

    - name: Upload RPM artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-rpm
        path: rpmbuild/RPMS/**/*.rpm

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure
      working-directory: specs/src
      run: python3 setup.py -c CLANG --python python3

    - name: Build
      working-directory: specs/src
      run: make some

    - name: Verify binary
      run: specs/exe/specs "@version"

    - name: Prepare manpage
      run: |
        cp manpage specs.1
        gzip specs.1

    - name: Strip version prefix
      id: version
      run: echo "ver=${SPECS_VERSION#v}" >> "$GITHUB_OUTPUT"

    - name: Create pkg payload
      run: |
        mkdir -p pkg-root/usr/local/bin
        mkdir -p pkg-root/usr/local/share/man/man1
        cp specs/exe/specs pkg-root/usr/local/bin/
        cp specs/exe/specs-autocomplete pkg-root/usr/local/bin/
        chmod 755 pkg-root/usr/local/bin/specs
        chmod 755 pkg-root/usr/local/bin/specs-autocomplete
        cp specs.1.gz pkg-root/usr/local/share/man/man1/

    - name: Build .pkg
      run: |
        pkgbuild \
          --root pkg-root \
          --identifier com.github.yoavnir.specs \
          --version "${{ steps.version.outputs.ver }}" \
          --install-location / \
          specs-${{ steps.version.outputs.ver }}.pkg

    - name: Upload pkg artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-pkg
        path: specs-*.pkg

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build specs (Release)
      run: msbuild specs/specs.sln /p:Configuration=Release /p:Platform=x64

    - name: Verify binary
      run: specs\bin\Release\specs.exe "@version"

    - name: Strip version prefix
      id: version
      shell: bash
      run: echo "ver=${SPECS_VERSION#v}" >> "$GITHUB_OUTPUT"

    - name: Prepare standalone executable
      shell: bash
      run: cp specs/bin/Release/specs.exe specs-${{ steps.version.outputs.ver }}-windows-x64.exe

    - name: Install WiX Toolset
      run: dotnet tool install --global wix --version 4.0.6

    - name: Create WiX source
      shell: bash
      run: sed "s/@VERSION@/${{ steps.version.outputs.ver }}/g" .github/packaging/specs.wxs.in > specs.wxs

    - name: Build MSI
      shell: bash
      run: wix build -o specs-${{ steps.version.outputs.ver }}.msi specs.wxs

    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-msi
        path: specs-*.msi

    - name: Upload standalone executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: specs-*-windows-x64.exe

  build-deb:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            container: ubuntu:22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build tools
      run: |
        if [ "$(id -u)" -eq 0 ]; then
          APT="apt-get"
        else
          APT="sudo apt-get"
        fi
        $APT update
        $APT install -y gcc g++ make python3 python3-dev dpkg-dev git libexpat1-dev zlib1g-dev

    - name: Configure
      working-directory: specs/src
      run: python3 setup.py --python python3 --static

    - name: Build
      working-directory: specs/src
      run: make some

    - name: Verify binary
      run: specs/exe/specs "@version"

    - name: Verify no dynamic libpython dependency
      run: |
        if ldd specs/exe/specs | grep -q libpython; then
          echo "ERROR: specs still dynamically links libpython"
          ldd specs/exe/specs | grep libpython
          exit 1
        fi
        echo "OK: no dynamic libpython dependency"

    - name: Prepare manpage
      run: |
        cp manpage specs.1
        gzip specs.1

    - name: Strip version prefix
      id: version
      run: echo "ver=${SPECS_VERSION#v}" >> "$GITHUB_OUTPUT"

    - name: Create DEB build tree
      run: |
        mkdir -p deb-root/usr/local/bin
        mkdir -p deb-root/usr/share/specs
        mkdir -p deb-root/usr/lib/specs
        mkdir -p deb-root/DEBIAN
        cp specs/exe/specs deb-root/usr/local/bin/
        cp specs/exe/specs-autocomplete deb-root/usr/local/bin/
        chmod 755 deb-root/usr/local/bin/specs
        chmod 755 deb-root/usr/local/bin/specs-autocomplete
        cp specs.1.gz deb-root/usr/share/specs/
        sed "s/@VERSION@/${{ steps.version.outputs.ver }}/g; s/Architecture: amd64/Architecture: ${{ matrix.arch }}/g" .github/packaging/control.in > deb-root/DEBIAN/control
        cp .github/packaging/postinst deb-root/DEBIAN/
        cp .github/packaging/postrm deb-root/DEBIAN/
        
    - name: Bundle Python stdlib for DEB
      run: |
        PYVER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
        mkdir -p deb-root/usr/lib/specs/python/lib/python${PYVER}
        cp -r /usr/lib/python${PYVER}/* deb-root/usr/lib/specs/python/lib/python${PYVER}/
        # Remove unnecessary files to reduce package size
        find deb-root/usr/lib/specs/python/lib/python${PYVER} -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        find deb-root/usr/lib/specs/python/lib/python${PYVER} -type f -name "*.pyc" -delete
        find deb-root/usr/lib/specs/python/lib/python${PYVER} -type f -name "*.pyo" -delete
        rm -rf deb-root/usr/lib/specs/python/lib/python${PYVER}/site-packages
        rm -rf deb-root/usr/lib/specs/python/lib/python${PYVER}/dist-packages

    - name: Build DEB
      run: |
        dpkg-deb --build deb-root specs_${{ steps.version.outputs.ver }}_${{ matrix.arch }}.deb

    - name: Upload DEB artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-deb-${{ matrix.arch }}
        path: specs_*.deb

  publish:
    needs: [build-linux, build-macos, build-windows, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List artifacts
      run: find artifacts -type f

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/linux-rpm/**/*.rpm
          artifacts/linux-deb-amd64/*.deb
          artifacts/linux-deb-arm64/*.deb
          artifacts/macos-pkg/*.pkg
          artifacts/windows-msi/*.msi
          artifacts/windows-exe/*.exe
